name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Typecheck + testes + build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck (todos os workspaces)
        run: npm run typecheck
      - name: Testes (todos os workspaces)
        run: npm test
      - name: Lint web
        run: npm run lint --workspace apps/web --if-present
      - name: Security audit
        run: npm audit --audit-level=high --omit=dev
      - name: Build web
        run: npm run build --workspace apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}
