# Ambiente local completo:
#   1. Backend (Postgres/Auth/Storage/Realtime/Functions/Studio):
#        npm run db:start   ← containers gerenciados pelo Supabase CLI
#   2. Dashboard web em modo produção (opcional — dev use `npm run web`):
#        docker compose up --build web
#
# O browser acessa o Supabase em http://127.0.0.1:55321 (porta publicada pelo
# CLI no host); o servidor Next DENTRO do container usa host.docker.internal.
# As chaves abaixo são as chaves demo públicas do Supabase CLI local.

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55321
        NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
    environment:
      # Override server-side: dentro do container, 127.0.0.1 não é o host.
      SUPABASE_URL: http://host.docker.internal:55321
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # 3005 no host (3000 está ocupada pelo attendance_frontend); 3000 interno
      - "3005:3000"
